<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>In the kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0b0d16; --paper:#efe6d2; --paper-dim:#b9b09c; --ink:#211d20;
  --lantern:#f0b062; --noren:#2f3f63; --steel-hi:#b9c1c8; --steel-lo:#6d7680;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]),:root[data-theme="dark"],:root[data-theme="light"]{ --night:#0b0d16; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#000;color:var(--paper);overflow:hidden;
  font-family:"Courier Prime","Courier New",Courier,monospace;font-size:16px;line-height:1.45}
#stage{position:fixed;inset:0;background:#000}
#cv{position:absolute;display:block;left:50%;top:50%;transform:translate(-50%,-50%)}
body.clean,body.clean *{cursor:none!important}
body.clean #mixer,body.clean #toast{display:none}

/* ── start screen: each kitchen is an order ticket clipped to the rail; the chosen one hangs a little lower ── */
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 20px;overflow:auto;background:radial-gradient(ellipse at 50% 38%,rgba(11,13,22,.76),rgba(11,13,22,.95) 78%)}
#start[hidden]{display:none}
#start h1{margin:0 0 30px;font-size:clamp(2.2rem,6.5vw,3.9rem);font-weight:700;letter-spacing:-.035em;line-height:1;text-align:center}
.rail{width:min(900px,100%);height:10px;border-radius:5px;flex:none;
  background:linear-gradient(var(--steel-hi),var(--steel-lo));box-shadow:0 3px 0 rgba(0,0,0,.45)}
.tickets{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;width:min(860px,100%);margin:-2px 0 40px;padding:0 10px;
  filter:drop-shadow(0 12px 12px rgba(0,0,0,.42))}
.ticket{position:relative;font:inherit;text-align:left;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;
  display:flex;transform-origin:top center;transition:transform .2s}
.ticket:nth-child(odd){transform:rotate(-.8deg)} .ticket:nth-child(even){transform:rotate(.7deg)}
.ticket[aria-pressed="true"]{transform:translateY(12px)}
.ticket::before{content:"";position:absolute;left:50%;top:-10px;width:36px;height:17px;margin-left:-18px;border-radius:3px;z-index:1;
  background:linear-gradient(var(--steel-hi),var(--steel-lo));box-shadow:0 2px 0 rgba(0,0,0,.35)}                          /* the clip */
.ticket .paper{display:flex;flex-direction:column;flex:1;min-width:0;min-height:172px;padding:22px 14px 26px;background:var(--paper-dim);transition:background .2s;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;
  mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%}                              /* torn lower edge */
.ticket:hover .paper{background:#d6cdb8}
.ticket[aria-pressed="true"] .paper{background:var(--paper);box-shadow:inset 0 6px 0 var(--lantern)}
.ticket .no{position:absolute;right:12px;top:20px;width:26px;height:26px;border-radius:50%;border:2px solid currentColor;
  display:grid;place-items:center;font-weight:700;font-size:.85rem;line-height:1;opacity:.6}
.ticket[aria-pressed="true"] .no{background:var(--ink);border-color:var(--ink);color:var(--paper);opacity:1}
.ticket b{font-size:1.2rem;line-height:1.1;padding-right:34px}
.ticket ul{list-style:none;margin:12px 0 0;padding:11px 0 0;border-top:2px dashed rgba(33,29,32,.3);display:grid;gap:4px;font-size:.84rem;line-height:1.25}
.ticket li{padding-left:15px;position:relative}
.ticket li::before{content:"";position:absolute;left:1px;top:.42em;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5}
#begin{font:inherit;font-weight:700;font-size:1.15rem;color:var(--ink);background:var(--lantern);border:0;border-radius:4px;
  padding:14px 56px;cursor:pointer;box-shadow:0 4px 0 #8f5f2a}
#begin:active{transform:translateY(2px);box-shadow:0 2px 0 #8f5f2a}
#begin:disabled{opacity:.6;cursor:progress}
.how{list-style:none;margin:34px 0 0;padding:20px 10px 0;width:min(860px,100%);display:grid;grid-template-columns:repeat(2,1fr);gap:10px 34px;
  font-size:.86rem;line-height:1.35;color:var(--paper-dim);border-top:1px dashed rgba(239,230,210,.24)}
.how li{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:baseline}
.how .k{white-space:nowrap}
kbd{display:inline-block;font:inherit;font-weight:700;font-size:.78rem;line-height:1.3;color:var(--paper);
  border:1px solid rgba(239,230,210,.42);border-bottom-width:3px;border-radius:5px;padding:1px 8px}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* ── mixer ── */
#mixer{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:440px;max-width:calc(100% - 32px);
  background:rgba(14,15,24,.86);border:1px solid rgba(239,230,210,.16);border-radius:4px;padding:12px 14px 12px;font-size:.82rem}
#mixer[hidden]{display:none}
#mixer .sliders{display:grid;grid-template-columns:1fr 1fr;gap:9px 20px}
#mixer label{display:grid;gap:3px;line-height:1.2}
#mixer label.main{color:var(--lantern)}
@media (max-width:520px){#mixer .sliders{grid-template-columns:1fr;gap:6px}#mixer label{grid-template-columns:1fr 46%;align-items:center;gap:10px}}
#mixer input[type=range]{width:100%;accent-color:var(--lantern);height:18px;margin:0}
#mixer .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
#muteBtn[aria-pressed="true"]{background:var(--lantern)!important;color:var(--ink)!important;border-color:var(--lantern)!important}
#mixer button{font:inherit;flex:1 1 90px;white-space:nowrap;color:var(--paper);background:transparent;border:1px solid rgba(239,230,210,.3);border-radius:3px;padding:6px 4px;cursor:pointer}
#otherLbl{cursor:help}#otherLbl .info{opacity:.7}
#tip{position:absolute;left:0;right:0;bottom:calc(100% + 8px);background:var(--paper);color:var(--ink);padding:10px 12px;border-radius:3px;font-size:.8rem;line-height:1.4;box-shadow:0 8px 20px rgba(0,0,0,.4)}
#tip[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);
  padding:8px 16px;border-radius:2px;font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}
#toast.on{opacity:1}
@media (max-width:640px){
  .tickets{grid-template-columns:repeat(2,1fr);row-gap:28px} .ticket .paper{min-height:150px}
  .how{grid-template-columns:1fr}
  #start{justify-content:flex-start}
}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="1920" height="1080" role="img" aria-label="Animated illustration of cooks working in a restaurant kitchen"></canvas></div>

<section id="start" aria-label="Start">
  <h1>In the kitchen</h1>
  <div class="rail" aria-hidden="true"></div>
  <div class="tickets">
    <button class="ticket" data-scene="ramen" aria-pressed="true"><span class="paper"><span class="no" aria-hidden="true">1</span><b>Ramen shop</b><ul><li>Rainy night</li><li>70 bpm</li><li>Minor and moody</li></ul></span></button>
    <button class="ticket" data-scene="diner" aria-pressed="false"><span class="paper"><span class="no" aria-hidden="true">2</span><b>Diner</b><ul><li>Sunday morning</li><li>85 bpm</li><li>Bright major 7ths</li></ul></span></button>
    <button class="ticket" data-scene="bistro" aria-pressed="false"><span class="paper"><span class="no" aria-hidden="true">3</span><b>Bistro</b><ul><li>Busy evening</li><li>80 bpm</li><li>Jazzy, walking bass</li></ul></span></button>
    <button class="ticket" data-scene="bakery" aria-pressed="false"><span class="paper"><span class="no" aria-hidden="true">4</span><b>Bakery</b><ul><li>Snowy pre-dawn</li><li>72 bpm</li><li>Warm chords and bells</li></ul></span></button>
  </div>
  <button id="begin">Begin</button>
  <ul class="how">
    <li><span class="k"><kbd>H</kbd></span><span>Hide or show the controls for a clean recording</span></li>
    <li><span class="k"><kbd>1</kbd> to <kbd>4</kbd></span><span>Switch kitchens with a slow crossfade</span></li>
    <li><span class="k"><kbd>M</kbd></span><span>Mute</span></li>
    <li><span class="k"><kbd>F</kbd></span><span>Fullscreen</span></li>
    <li><span class="k"><kbd>Home</kbd></span><span>In the mixer, come back to this screen</span></li>
    <li><span class="k"><kbd>Double-tap</kbd></span><span>On a touch screen, bring the controls back</span></li>
  </ul>
</section>

<aside id="mixer" hidden aria-label="Sound mixer">
  <div class="sliders">
    <label class="main">Master volume<input type="range" min="0" max="100" value="100" id="masterVol"></label>
    <label>Music<input type="range" min="0" max="100" value="70" data-bus="music"></label>
    <label>Music bass<input type="range" min="0" max="100" value="50" id="bassEq"></label>
    <label>Ambient bed<input type="range" min="0" max="100" value="70" data-bus="bed"></label>
    <label>Chopping<input type="range" min="0" max="100" value="70" data-bus="chop"></label>
    <label>Pots and utensils<input type="range" min="0" max="100" value="70" data-bus="pots"></label>
    <label id="otherLbl" tabindex="0" aria-describedby="tip"><span>Other kitchen sounds <span class="info" aria-hidden="true">ⓘ</span></span><input type="range" min="0" max="100" value="70" data-bus="other"></label>
    <label>Chatter<input type="range" min="0" max="100" value="70" data-bus="chatter"></label>
  </div>
  <div id="tip" role="tooltip" hidden></div>
  <div class="row"><button id="muteBtn" aria-pressed="false">Mute (M)</button><button id="homeBtn">Home</button><button id="hideBtn">Hide (H)</button><button id="fsBtn">Fullscreen (F)</button></div>
</aside>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script>
(()=>{
'use strict';
/* =====================================================================
   IN THE KITCHEN
   File layout:
     1. Utilities
     2. Audio engine   (buses, synthesized one-shots, beds, chatter)
     3. Music engine   (Tone.js lo-fi generator, driven by a scene config)
     4. Cook rig       (shared by every scene)
     5. Scenes         SCENES.ramen = () => ({...})   add diner / bistro / bakery here
     6. App shell      (loop, camera drift, crossfade, controls)
   ===================================================================== */

/* ───────────────────────── 1. UTILITIES ───────────────────────── */
const W=1920,H=1080,TAU=Math.PI*2,DEG=Math.PI/180;
const R=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const hash=i=>{const v=Math.sin(i*127.1+311.7)*43758.5453;return v-Math.floor(v);};
function wpick(items,wf){let s=0;const ws=items.map(i=>{const w=wf(i);s+=w;return w;});let r=Math.random()*s;
  for(let i=0;i<items.length;i++){r-=ws[i];if(r<=0)return items[i];}return items[items.length-1];}
function seeded(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mk(w=W,h=H){const c=document.createElement('canvas');c.width=w;c.height=h;return[c,c.getContext('2d')];}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function ell(g,x,y,rx,ry){g.beginPath();g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,TAU);}
function ln(g,x0,y0,x1,y1){g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();}
function lg(g,x0,y0,x1,y1,...st){const gr=g.createLinearGradient(x0,y0,x1,y1);for(let i=0;i<st.length;i+=2)gr.addColorStop(st[i],st[i+1]);return gr;}
function rg(g,x,y,r0,r1,...st){const gr=g.createRadialGradient(x,y,r0,x,y,r1);for(let i=0;i<st.length;i+=2)gr.addColorStop(st[i],st[i+1]);return gr;}
function shade(hex,k){const n=parseInt(hex.slice(1),16);const f=v=>Math.round(clamp(v*k,0,255));return`rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`;}
function mix(a,b,t){const x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16);const f=s=>Math.round(lerp(x>>s&255,y>>s&255,t));return`rgb(${f(16)},${f(8)},${f(0)})`;}
function* sleep(d){while(d>0)d-=yield;}
const panX=x=>clamp(x/W*1.3-.65,-1,1);
let PRE=false,radioOn=true;           // PRE: a kitchen is being run ahead, silently, before it is shown.  radioOn: the music can be heard
const noteHz=n=>{const m=/^([A-G])([#b]?)(-?\d)$/.exec(n);if(!m)return 220;const pc={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);return 440*Math.pow(2,(pc-9)/12+(+m[3]-4));};

/* ───────────────────────── 2. AUDIO ENGINE ─────────────────────────
   Everything except the music is built from raw Web Audio nodes on Tone's
   context: filtered noise bursts, short oscillators, and a few pre-rendered
   loops.  Six buses match the six mixer sliders; Master volume sits after them all. */
const A={ready:false,bus:{}};
let ac=null;
const BUSES=['music','bed','chop','pots','other','chatter'];
const TRIM={music:1.73,bed:.38,chop:.55,pots:.75,other:.62,chatter:.5};
const masterGain=v=>Math.pow(v/100,1.7)*.85;      // the Master volume slider: everything, after the limiter
const sliderGain=(v,bus)=>Math.pow(v/100,1.7)*1.6*(TRIM[bus]||1);

function initAudio(ctx){
  ac=ctx;
  A.master=ac.createGain();A.master.gain.value=0;
  const comp=ac.createDynamicsCompressor();
  comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=2.5;comp.attack.value=.02;comp.release.value=.3;
  const lim=ac.createDynamicsCompressor(),outG=ac.createGain();
  lim.threshold.value=-3;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=.002;lim.release.value=.1;outG.gain.value=masterGain(+document.getElementById('masterVol').value);A.out=outG;
  A.master.connect(comp);comp.connect(lim);lim.connect(outG);outG.connect(ac.destination);
  // small-room reverb so the one-shots sit in a tiled kitchen
  A.rev=ac.createConvolver();A.rev.buffer=impulse(1.3);
  const rgn=ac.createGain();rgn.gain.value=.9;A.rev.connect(rgn);rgn.connect(A.master);
  const sends={music:.12,bed:0,chop:.14,pots:.24,other:.22,chatter:.5};
  for(const n of BUSES){
    const b=ac.createGain();b.gain.value=sliderGain(+document.querySelector(`[data-bus="${n}"]`).value,n);
    if(n==='music'){A.bass=ac.createBiquadFilter();A.bass.type='lowshelf';A.bass.frequency.value=170;A.bass.gain.value=(+document.getElementById('bassEq').value-50)*.3;b.connect(A.bass);A.bass.connect(A.master);}   // the Music bass slider
    else if(n==='other'){const hs=ac.createBiquadFilter();hs.type='highshelf';hs.frequency.value=5500;hs.gain.value=-3;b.connect(hs);hs.connect(A.master);}   // take the edge off the brightest one-shots
    else b.connect(A.master);
    if(sends[n]){const s=ac.createGain();s.gain.value=sends[n];b.connect(s);s.connect(A.rev);}
    A.bus[n]=b;
  }
  A.white=noiseBuf(3);
  A.ready=true;
}
function noiseBuf(sec){const n=Math.floor(sec*ac.sampleRate),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return b;}
function impulse(sec){const sr=ac.sampleRate,n=Math.floor(sec*sr),b=ac.createBuffer(2,n,sr);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let p=0;
    for(let i=0;i<n;i++){const e=Math.pow(1-i/n,2.6);p=p*.55+(Math.random()*2-1)*.45;d[i]=p*e*(i<sr*.004?i/(sr*.004):1);}}
  return b;}
/* Pre-render a seamless loop of many tiny events (bubbles, rain ticks, vinyl clicks). */
function renderLoop(sec,perSec,ev,floor=0){
  const sr=ac.sampleRate,n=Math.floor(sec*sr),b=ac.createBuffer(1,n,sr),d=b.getChannelData(0);
  if(floor)for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*floor;
  const count=Math.floor(sec*perSec);
  for(let k=0;k<count;k++)ev(d,Math.floor(Math.random()*n),n,sr);
  return b;
}

/* one-shot building blocks */
const now=()=>ac.currentTime+.012;
let SG=1;
const SGAIN={whoosh:.5,bell:.56,roll:.5,doughSlap:.8,press:.7,sprinkle:3.2,whiskTick:2,slash:2.5,brush:2,hone:2,tick:1.6,tink:1.6,rustle:1.6,drip:1.6,eggCrack:1.8,dishes:1.8,butter:1.4};
function ev(pan,bus,vol=1){const p=ac.createStereoPanner();p.pan.value=clamp(pan,-1,1);const v=ac.createGain();v.gain.value=vol*SG;v.connect(p);p.connect(A.bus[bus]);return v;}
function envGain(t,dur,g,a){const v=ac.createGain();v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(Math.max(.0002,g),t+a);v.gain.exponentialRampToValueAtTime(.0001,t+a+dur);return v;}
/* filtered noise burst.  Gain is normalised for bandwidth, so g ≈ loudness whatever the filter. */
function nz(o,t,dur,f,{type='bandpass',q=1,g=.3,a=.002,f2}={}){
  const s=ac.createBufferSource();s.buffer=A.white;s.loop=true;
  const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);fl.Q.value=q;
  if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+a+dur);
  const bw=type==='bandpass'?f/q:type==='lowpass'?f:Math.max(2500,18000-f);
  const v=envGain(t,dur,g*Math.min(12,Math.sqrt(18000/bw)),a);
  s.connect(fl);fl.connect(v);v.connect(o);s.start(t,Math.random()*2);s.stop(t+a+dur+.05);
}
function tn(o,t,dur,f,{type='sine',g=.2,a=.002,f2}={}){
  const os=ac.createOscillator();os.type=type;os.frequency.setValueAtTime(f,t);
  if(f2)os.frequency.exponentialRampToValueAtTime(f2,t+a+dur);
  const v=envGain(t,dur,g,a);os.connect(v);v.connect(o);os.start(t);os.stop(t+a+dur+.05);
}
function ring(o,t,base,parts,dur,g){parts.forEach((p,i)=>tn(o,t,dur/(1+i*.6),base*p,{g:g/(1+i*.8)}));}
/* continuous noise layer → returns {src,gain,stop} */
const bedIn=k=>{const g=ac.createGain();g.gain.value=k;g.connect(A.bus.bed);return g;};      // per-kitchen bed level
function noiseLoop(dest,filters,g,buf=A.white,rate=1,pan=0){
  const s=ac.createBufferSource();s.buffer=buf;s.loop=true;s.playbackRate.value=rate;let last=s;
  for(const[type,f,q]of filters){const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q||.7;last.connect(fl);last=fl;}
  const v=ac.createGain();v.gain.value=g;last.connect(v);
  const p=ac.createStereoPanner();p.pan.value=pan;v.connect(p);p.connect(dest);
  s.start(ac.currentTime,Math.random()*buf.duration*.9);
  return{src:s,gain:v,stop(){try{s.stop();}catch(e){}p.disconnect();}};
}

/* ── the one-shot library.  Call through SFX.name(...) – it is a no-op until audio is running. ── */
const SND={
  /* chopping: kind = dice | mince | slice | heavy, pitch = board/knife character */
  chop(kind,pitch,vel,pan){
    const t=now(),r=pitch*R(.93,1.07),o=ev(pan,'chop',vel);
    if(kind==='dice'){nz(o,t,.016,3400*r,{type:'highpass',g:.09});nz(o,t,.05,640*r,{q:2.4,g:.3});tn(o,t,.045,185*r,{type:'triangle',g:.2,f2:120*r});}
    else if(kind==='mince'){nz(o,t,.011,4300*r,{type:'highpass',g:.06});nz(o,t,.032,900*r,{q:3,g:.22});tn(o,t,.03,240*r,{type:'triangle',g:.09,f2:170*r});}
    else if(kind==='slice'){nz(o,t,.15,2300,{q:.8,g:.06,a:.07});nz(o,t+.14,.065,430*r,{q:2,g:.27});tn(o,t+.14,.06,140*r,{g:.2,f2:95*r});}
    else{nz(o,t,.02,2600*r,{type:'highpass',g:.07});nz(o,t,.085,390*r,{q:2,g:.33});tn(o,t,.09,115*r,{g:.3,f2:72*r});}
  },

/* ── chatter: a muffled murmur of voices from across the room.
      No noise at all here (filtered noise with moving filters is what sounded like a jet).  Each voice is a
      soft pitched buzz, like a real voice box, shaped by two vowel formants that glide from vowel to vowel.
      Pitch follows a spoken contour (starts higher, drifts down, small accents) with a natural waver, and
      everything is dulled and sent to the room reverb so no words can be made out.
      level = presence, density = how busy, call = seconds between louder call-outs. ── */
const VOWELS=[[730,1090],[530,1840],[300,2200],[570,850],[320,880],[500,1500],[640,1200],[440,1700]];
function startChatter({voices=6,level=1,density=.6,call=[20,45],laugh=[40,100],whistle=[80,220]}){
  const out=ac.createGain();out.gain.value=level*.4;out.connect(A.bus.chatter);
  const flt=(type,f,q)=>{const b=ac.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;return b;};
  const gn=v=>{const x=ac.createGain();x.gain.value=v;return x;},V=[];
  for(let i=0;i<voices;i++){
    const deep=i%2===0,f0=deep?R(100,135):R(180,225),fk=deep?1:1.14;
    const osc=ac.createOscillator();osc.type='sawtooth';osc.frequency.value=f0;
    const wav=ac.createOscillator(),wd=gn(f0*.012);wav.frequency.value=R(4.2,5.8);wav.connect(wd);wd.connect(osc.frequency);     // slight waver
    const drift=ac.createOscillator(),dd=gn(f0*.02);drift.frequency.value=R(.3,.7);drift.connect(dd);dd.connect(osc.frequency);  // slow drift
    const tilt=flt('lowpass',850,.3),b1=flt('bandpass',500*fk,4.5),b2=flt('bandpass',1500*fk,5.5),g2=gn(.45),body=flt('lowpass',280,.3),gb=gn(.22);
    const vg=gn(0),far=flt('lowpass',R(1100,1700),.3),pn=ac.createStereoPanner();pn.pan.value=R(-.8,.8);
    osc.connect(tilt);tilt.connect(b1);tilt.connect(b2);tilt.connect(body);
    b1.connect(vg);b2.connect(g2);g2.connect(vg);body.connect(gb);gb.connect(vg);vg.connect(far);far.connect(pn);pn.connect(out);
    osc.start();wav.start();drift.start();
    V.push({f0,fk,osc,wav,drift,b1,b2,vg,far,base:far.frequency.value,next:ac.currentTime+R(.3,5)});
  }
  let callAt=ac.currentTime+R(call[0],call[1]),laughAt=ac.currentTime+R(laugh[0],laugh[1])*.5,whistleAt=ac.currentTime+R(whistle[0],whistle[1])*.5;
  const id=setInterval(()=>{
    const t0=ac.currentTime;
    if(t0>laughAt){laughAt=t0+R(laugh[0],laugh[1]);SND.laugh(R(-.7,.7),R()<.5);}             // very occasional
    if(t0>whistleAt){whistleAt=t0+R(whistle[0],whistle[1]);SND.whistle(R(-.6,.6));}
    for(const v of V){
      if(v.next>t0+.5)continue;
      let t=Math.max(v.next,t0+.05);
      const isCall=t0>callAt;if(isCall)callAt=t0+R(call[0],call[1]);
      const n=isCall?RI(2,4):RI(5,14),amp=(isCall?2:1)*R(.45,1),pace=isCall?1.5:R(.85,1.2);   // brisk, working-kitchen pace
      const top=v.f0*(isCall?1.35:R(1.1,1.32)),fall=R(.15,.28),question=!isCall&&R()<.22;
      if(isCall)v.far.frequency.setTargetAtTime(2200,t,.08);
      for(let k=0;k<n;k++){
        const lastS=k===n-1,d=R(.065,.15)*pace*(lastS?1.6:1),vw=pick(VOWELS);
        const shape=Math.pow(Math.sin(Math.PI*(k+.8)/(n+.8)),.6),a=amp*shape*(k%2?R(.6,.85):R(.85,1.1));
        const p=top*(1-fall*k/n)*(R()<.3?1.1:1)*(lastS&&question?1.18:1)*R(.96,1.05);            // livelier accents
        v.osc.frequency.setTargetAtTime(p,t,.045);                                                    // glides, never steps
        v.b1.frequency.setTargetAtTime(vw[0]*v.fk*R(.93,1.07),t,d*.35);v.b2.frequency.setTargetAtTime(vw[1]*v.fk*R(.93,1.07),t,d*.35);
        v.vg.gain.setTargetAtTime(a,t,R(.015,.028));v.vg.gain.setTargetAtTime(a*R(.25,.55),t+d*.62,.025);
        t+=d;if(!lastS&&R()<.08){v.vg.gain.setTargetAtTime(0,t,.025);t+=R(.06,.16);}
      }
      v.vg.gain.setTargetAtTime(0,t,.11);
      if(isCall)v.far.frequency.setTargetAtTime(v.base,t+.3,.25);
      v.next=t+R(.3,3.2)/density;
    }
  },150);
  return()=>{clearInterval(id);V.forEach(v=>{try{v.osc.stop();v.wav.stop();v.drift.stop();}catch(e){}});out.disconnect();};
}

/* ───────────────────────── 3. MUSIC ENGINE (Tone.js) ─────────────────────────
   One generator, four different bands.  A scene config names its band and gives the harmony:
     { band, bpm, swing, scale?, progs:[{root, ch:[{n:[notes], b:bassNote} x4]}] }
   BANDS says what each room's band is made of (the tone of the keys, lead and bass, the drum kit and how it is
   played, how the chords are comped, how the bass moves) so the four rooms do not sound like one tape.
   So that an hour in does not sound like minute five, every section of 12 to 24 bars picks a progression it has
   not used lately, moves to a new key, drifts the tempo and swing a little, and takes one of several arrangements
   (full band, no lead, no drums, a duo, arpeggios, lead up high).  Every 4-bar phrase then re-rolls the comping,
   the chord voicing, the drum variation and the melody. */
const BANDS={
  /* rainy night: dark electric piano with a slow tremolo, a plucked koto-like lead with long echoes, a deep round bass,
     and a slow half-time beat with a rim click on three */
  ramen:{keys:{partials:[1,.35,.1,.04],env:{attack:.012,decay:6,sustain:.3,release:4},vol:-10,trem:[3,.26]},
    lead:{partials:[1,.6,.35,.2,.1],env:{attack:.003,decay:.5,sustain:0,release:.6},vol:-10.5,port:0,dly:.3,lp:3200,grace:.3},
    bass:{type:'sine',env:{attack:.02,decay:.3,sustain:.85,release:.5},vol:-13.5,fb:80,fo:1.6},out:.9,
    kick:-10,snare:{f:1900,q:2.4,decay:.05,vol:-12},hat:{f:5200,decay:.03,vol:-17},lp:[1400,2300],wob:.15,
    drum:'half',bassStyle:'long',comps:[0,0,1,3],kicks:[[0,10],[0,7],[0,11],[0],[0,10,14]],
    arr:{full:3,noLead:2,noDrums:3,duo:2,high:1},leads:{motif:3,long:2,rest:1.5}},
  /* sunny morning: a bright upright piano stabbing the backbeat, a vibraphone lead, a bouncing root-and-fifth bass,

   A cook is driven by a generator script (see scenes): it sets hand targets in
   world space, a held tool, lean and facing.  The rig adds the life: springy
   hands, a head that follows the work, weight shift, a small bounce on each
   knife stroke, eased walking, and soft curved limbs.
   Local units: origin at the feet, +x = facing direction, y up is negative. */

    if(W.deliv&&W.deliv.st==='call'&&(W.deliv.age=(W.deliv.age||0)+dt)>150)W.deliv=null;
    if((W.fohT-=dt)<0&&!W.foh){W.fohT=R(200,380);W.fohWant=true;}
    if(E.win){const Rg=W.reg,w=E.win;
      if(!Rg){if((W.regT-=dt)<0){W.regT=R(300,520);const dir=R()<.5?1:-1;W.reg={x:dir>0?w.x-60:w.x+w.w+60,dir,st:'walk',stop:w.x+w.w*R(.35,.65),t:0,ph:0,done:false};}}
      else if(Rg.st==='walk'){Rg.x+=Rg.dir*46*dt;Rg.ph+=dt*5.5;if(!Rg.done&&(Rg.stop-Rg.x)*Rg.dir<=0){Rg.st='turn';Rg.t=0;}if(Rg.x<w.x-70||Rg.x>w.x+w.w+70)W.reg=null;}
      else if(Rg.st==='turn'){if((Rg.t+=dt)>.8){Rg.st='wave';Rg.t=0;W.wave={x:w.cx==null?w.x+w.w/2:w.cx,t:0,taken:false};}}
      else{if((Rg.t+=dt)>5.5){Rg.st='walk';Rg.done=true;W.wave=null;}}}
    /* the cat comes down off the shelf to sleep by the viewer for a while */
    const C=W.cat;if(C){C.t-=dt;
      if(C.st==='shelf'){if(C.t<0&&quiet){C.st='down';C.k=0;}}
      else if(C.st==='down'){if((C.k+=dt/.7)>=1){C.st='away';C.t=5;}}
      else if(C.st==='away'){if(C.t<0){C.st='up';C.k=0;}}
      else if(C.st==='up'){if((C.k+=dt/.6)>=1){C.st='front';C.t=R(420,720);W.purrT=2;}}
      else if(C.st==='front'){if((W.purrT-=dt)<0){W.purrT=2.7;SFX.purr(.3);}if(C.t<0){C.st='off';C.k=0;}}
      else if(C.st==='off'){if((C.k+=dt/.6)>=1){C.st='back';C.t=5;}}
      else if(C.st==='back'){if(C.t<0){C.st='home';C.k=0;}}
      else if(C.st==='home'){if((C.k+=dt/.7)>=1){C.st='shelf';C.t=R(600,900);}}}
  };
  /* drawn over the cooks, under the front counter */
  W.air=(g,t)=>{
    g.lineCap='round';
    for(const p of W.wisps){const k=p.life/p.max,a=Math.sin(Math.PI*k)*.2,s=Math.sin(p.life*1.7+p.ph)*8;g.strokeStyle=`rgba(255,244,228,${a})`;g.lineWidth=p.w*(1+k*2.4);
      g.beginPath();g.moveTo(p.x,p.y);g.quadraticCurveTo(p.x+s,p.y-14-k*10,p.x-s*.6,p.y-30-k*22);g.stroke();}
    g.globalCompositeOperation='lighter';
    for(const h of W.hot||[]){if(h.glow===0)continue;const fl=(.75+.25*Math.sin(t*7.3+h.x)+.12*Math.sin(t*17.1+h.x*.3))*h.k*(h.glow||1),r=h.w*1.5+40;
      g.fillStyle=rg(g,h.x,h.y,0,r,0,`rgba(255,150,70,${.16*fl})`,1,'rgba(255,150,70,0)');g.fillRect(h.x-r,h.y-r,r*2,r*2);}
    for(const p of W.sparks){g.globalAlpha=1-p.life/p.max;g.fillStyle='#ffe2b0';g.fillRect(p.x,p.y,2.8,2.8);}
    g.globalAlpha=1;g.globalCompositeOperation='source-over';};
  /* the cat on its shelf (or on its way) */
  W.catShelf=(g,t,x,y,col)=>{const C=W.cat;if(!C||C.st==='shelf'){drawCat(g,x,y,t,col);return;}
    if(C.st==='down'){const k=C.k;drawCatLeap(g,x+k*70,y-18-Math.sin(Math.PI*Math.min(1,k*1.2))*40+k*k*230,1,col,false);}
    else if(C.st==='home'){const k=1-C.k;drawCatLeap(g,x+k*70,y-18-Math.sin(Math.PI*Math.min(1,k*1.2))*40+k*k*230,-1,col,true);}};
  /* the viewer's place, and the cat if it has come over */
  W.front=(g,t)=>{
    if(E.front)E.front(g,t);
    const C=W.cat;
    if(C&&E.catFront){const[cx,cy]=E.catFront,col=E.catCol||'#c98a4a';
      if(C.st==='front'){g.save();g.translate(cx,cy);g.scale(-2.1,2.1);drawCat(g,0,0,t,col);g.restore();}
      else if(C.st==='up'||C.st==='off'){const k=C.st==='up'?C.k:1-C.k;g.save();g.translate(cx+(1-k)*60,cy-40-Math.sin(Math.PI*k*.9)*70+(1-k)*(1-k)*260);g.scale(2.1,2.1);drawCatLeap(g,0,0,-1,col,C.st==='up');g.restore();}}
    drawYou(g,Y,t);};
  return W;
}
/* ───────────────────────── 4c. ANIMALS ─────────────────────────
   Small lives around the edges of each room: birds on a wire outside, a cat on the sill, goldfish, a dog by the
   viewer's seat, a cockatiel that bobs to the music, moths round the lamps, a mouse after crumbs. */
function mkBirds(WIN,wireY,cols,o={}){
  const B=cols.map((col,i)=>({x:WIN.x+WIN.w*([.32,.41,.68,.8][i]||R(.2,.8)),x0:0,x1:0,dir:i%2?1:-1,st:'sit',t:R(2,9),k:0,col}));
  const calm=()=>B.every(q=>q.st==='sit'||q.st==='hop'||q.st==='fluff');
  return{list:B,
    step(dt){
      for(const b of B){b.t-=dt;
        if(b.st==='sit'){if(b.t<0){const r=R(),free=x=>x>WIN.x+30&&x<WIN.x+WIN.w-30&&B.every(q=>q===b||Math.abs((q.st==='hop'?q.x1:q.x)-x)>24);
            if(r<.4){const nx=b.x+pick([-1,1])*R(14,40);if(free(nx)){b.st='hop';b.x0=b.x;b.x1=nx;b.dir=nx>b.x?1:-1;b.k=0;if(R()<.25)SFX.chirp(panX(b.x)-.2);}else b.t=R(1,3);}
            else if(r<.65){b.st='fluff';b.t=R(.7,1.1);if(R()<.3)SFX.chirp(panX(b.x)-.2);}
            else if(r<.87){b.dir=-b.dir;b.t=R(2,7);}
            else if(calm()){b.st='leave';b.k=0;b.x0=b.x;b.dir=b.x>WIN.x+WIN.w/2?1:-1;}
            else b.t=R(2,5);}}
        else if(b.st==='hop'){b.k+=dt/.28;b.x=lerp(b.x0,b.x1,Math.min(1,b.k));if(b.k>=1){b.st='sit';b.t=R(2,8);}}
        else if(b.st==='fluff'){if(b.t<0){b.st='sit';b.t=R(3,9);}}
        else if(b.st==='leave'){b.k+=dt/1.5;if(b.k>=1){b.st='gone';b.t=R(9,26);}}
        else if(b.st==='gone'){if(b.t<0){let nx=0,n=0;do{nx=WIN.x+R(40,WIN.w-40);}while(n++<20&&B.some(q=>q!==b&&Math.abs(q.x-nx)<26));b.x0=b.x=nx;b.dir=nx>WIN.x+WIN.w/2?-1:1;b.st='come';b.k=0;}}
        else{b.k+=dt/1.5;if(b.k>=1){b.st='sit';b.t=R(2,7);}}}
    },
    draw(g,t){
      g.strokeStyle=o.wire||'rgba(12,14,24,.9)';g.lineWidth=o.thick||1.6;g.lineCap='round';g.beginPath();for(let x=WIN.x;x<=WIN.x+WIN.w;x+=30)x===WIN.x?g.moveTo(x,wireY(x)):g.lineTo(x,wireY(x));g.stroke();
      if(o.snow){g.strokeStyle='rgba(240,246,255,.9)';g.lineWidth=3;g.beginPath();for(let x=WIN.x;x<=WIN.x+WIN.w;x+=30)x===WIN.x?g.moveTo(x,wireY(x)-o.thick/2):g.lineTo(x,wireY(x)-o.thick/2);g.stroke();}
      const top=(o.thick||1.6)/2+(o.snow?2:0);
      for(const b of B){if(b.st==='gone')continue;
        let x=b.x,y=wireY(b.x)-top,fly=0,sc=1,wob=0;
        if(b.st==='hop')y-=Math.sin(Math.PI*Math.min(1,b.k))*7;
        else if(b.st==='fluff'){sc=1.22;wob=Math.sin(t*46)*1.3;}
        else if(b.st==='leave'||b.st==='come'){const k=ease(b.st==='leave'?b.k:1-b.k);x=b.x0+b.dir*(b.st==='leave'?1:-1)*k*(WIN.w*.7);y=wireY(b.x0)-top-k*150-Math.sin(Math.PI*k)*20;fly=1;}
        g.save();g.translate(x+wob,y);g.scale(b.dir,1);g.fillStyle=b.col;g.strokeStyle=b.col;g.lineCap='round';
        if(!fly){g.lineWidth=1.3;ln(g,-2,-2,-2,1);ln(g,2,-2,2,1);}
        g.lineWidth=3;ln(g,-6*sc,-6,-14,-2+(fly?-3:0));
        ell(g,0,-8,8.5*sc,6.6*sc);g.fill();ell(g,6.5,-14-(sc-1)*4,4.6,4.4);g.fill();
        if(o.breast){g.fillStyle=o.breast;ell(g,3.5,-7,5*sc,4.6*sc);g.fill();g.fillStyle=b.col;}
        g.beginPath();g.moveTo(10.5,-15);g.lineTo(14.5,-13.6);g.lineTo(10.5,-12.6);g.fill();
        if(fly){const w=Math.sin(t*26);g.lineWidth=3.4;g.beginPath();g.moveTo(-1,-10);g.quadraticCurveTo(-5,-16-w*10,-11,-12-w*14);g.stroke();}
        g.restore();}
    }};
}
function drawSillCat(g,x,y,t,col){      // a cat sitting outside on the sill, out of the rain: watches the birds, bats at a raindrop on the glass
  const u=t%38,win=(a,b,k)=>u>a&&u<b?Math.min(1,Math.sin(Math.PI*(u-a)/(b-a))*k):0,up=win(6,14,3),paw=win(21,25,3),tw=Math.sin(t*.53)>.96?-3:0;
  g.fillStyle=col;g.strokeStyle=col;g.lineCap='round';
  g.lineWidth=7;g.beginPath();g.moveTo(x-16,y-6);g.quadraticCurveTo(x-40,y-4,x-42+Math.sin(t*1.9)*7,y-30-Math.sin(t*1.9+1)*4);g.stroke();     // tail, swishing
  ell(g,x,y-22,20,25);g.fill();ell(g,x+7,y-10,17,12);g.fill();
  if(paw>0){g.lineWidth=7;ln(g,x+14,y-28,x+30,y-46-paw*8+Math.sin(t*11)*4);}
  const hx=x+9-up*5,hy=y-55-up*5;ell(g,hx,hy,13.5,12);g.fill();
  g.beginPath();g.moveTo(hx-11,hy-6);g.lineTo(hx-9-up*3,hy-21+tw);g.lineTo(hx-1,hy-10);g.fill();g.beginPath();g.moveTo(hx+2,hy-10);g.lineTo(hx+8-up*3,hy-22);g.lineTo(hx+12,hy-6);g.fill();
  g.fillStyle='rgba(255,220,150,.75)';ell(g,hx+7-up*2,hy-1-up*3,1.6,2);g.fill();                                                                    // an eye catching the shop light
}
function drawFishBowl(g,x,y,t){         // two goldfish on the counter
  const r=60,cy=y-r+7;

  const wl=cy-r*.56+Math.sin(t*1.3)*1.2;g.fillStyle='rgba(96,160,186,.5)';g.fillRect(x-r,wl,2*r,2*r);g.fillStyle='rgba(215,240,250,.5)';g.fillRect(x-r,wl,2*r,2);
  g.fillStyle='#c9b38a';ell(g,x,cy+r-3,r*.82,13);g.fill();g.fillStyle='#a8946e';for(let i=0;i<5;i++){ell(g,x-34+i*17,cy+r-9-hash(i)*3,5,3.4);g.fill();}

    g.save();g.translate(fx,fy);g.scale(d,1);g.fillStyle=c2;g.beginPath();g.moveTo(-9,0);g.lineTo(-21,-8+wag*6);g.lineTo(-18,0);g.lineTo(-21,8+wag*6);g.fill();
    g.fillStyle=c1;ell(g,0,0,12.5,7.2);g.fill();g.fillStyle=c2;g.beginPath();g.moveTo(-3,-6);g.lineTo(3,-12);g.lineTo(5,-6);g.fill();
    g.fillStyle='#2a1d18';ell(g,7,-1.5,1.5,1.5);g.fill();g.restore();});
  for(let i=0;i<3;i++){const k=((t*.22+i*.37)%1),by=cy+r-14-k*(cy+r-14-wl);g.strokeStyle=`rgba(230,245,255,${.6*(1-k)})`;g.lineWidth=1.2;g.beginPath();g.arc(x+18+i*7+Math.sin(t*3+i)*2,by,1.6+k*1.6,0,TAU);g.stroke();}
  g.restore();
  g.strokeStyle='rgba(225,240,250,.55)';g.lineWidth=2.5;g.beginPath();g.arc(x,cy,r,0,TAU);g.stroke();
  g.strokeStyle='rgba(235,245,252,.7)';g.lineWidth=3;ell(g,x,cy-r*.83,r*.56,6);g.stroke();

}
function drawSeatDog(g,x,t,dog){        // a dog sitting on the floor by the viewer's stool: its head comes up over the counter edge to see what's on the plate
  const k=ease(clamp(dog.k,0,1));if(k<=0)return;

  g.restore();
}
function drawCockatiel(g,x,y,t,o){      // on a brass perch on the counter: bobs along to the music, preens, stretches its wings
  const u=t%44,win=(a,b,k)=>u>a&&u<b?Math.min(1,Math.sin(Math.PI*(u-a)/(b-a))*k):0,preen=win(12,17,3),flap=win(27,29.2,3),crest=Math.max(win(5,9,3),flap,win(34,37,3));
  const sx=Math.round(Math.sin(u*.14)*1.4)*14,py=y-176,bob=o.dance&&!preen&&!flap?Math.abs(Math.sin(Math.PI*t*o.bpm/60))*6:Math.sin(t*1.3)*1;

  g.strokeStyle='#8a6a5a';g.lineWidth=2.4;ln(g,bx-3,by-4,bx-3,by+1);ln(g,bx+4,by-4,bx+4,by+1);

  g.fillStyle='#f0d86a';ell(g,hx,hy,11.5,11.5);g.fill();g.fillStyle='#ef8a3a';ell(g,hx+1-preen*2,hy+3,4.4,4.4);g.fill();
  g.fillStyle='#2a1d18';ell(g,hx+5-preen*9,hy-3,1.7,1.7);g.fill();
  g.fillStyle='#9a9088';g.beginPath();const bd=preen>0?-1:1;g.moveTo(hx+bd*10,hy-2);g.quadraticCurveTo(hx+bd*17,hy+1,hx+bd*11,hy+7);g.lineTo(hx+bd*8,hy+3);g.fill();
}

  c.pose='side';c.moving=true;c.leanT=0;if(!c.carry)restArms(c);

    for(let i=steam.length-1;i>=0;i--){const p=steam[i];p.life+=dt;if(p.life>p.max){steam.splice(i,1);continue;}p.x+=(p.vx+Math.sin(t*.7+p.y*.02)*8)*dt;p.y+=p.vy*dt;p.vy*=1-dt*.25;}
    if((bgSfx.tink-=dt)<0){bgSfx.tink=R(9,24);SFX.tink(R(-.6,.6));}
    if((bgSfx.dish-=dt)<0){bgSfx.dish=R(26,60);SFX.dishes();}
    if((bgSfx.lid-=dt)<0){bgSfx.lid=R(24,60);SFX.lid(R(-.4,.4));}
    if((bgSfx.wind-=dt)<0){bgSfx.wind=R(3,7);if(aud){aud.wind.gain.gain.setTargetAtTime(R(.12,.4),ac.currentTime,2);aud.whis.gain.gain.setTargetAtTime(R(0,.04),ac.currentTime,2.5);}}
  }
  function draw(g,t,cam){
    g.drawImage(bgC,0,0);drawWindow(g,t);drawLights(g,866,1214,342,t,8);WARM.catShelf(g,t,470,488,'#c98a4a');drawRadio(g,610,488,t,{body:'#6a4a34'});drawClock(g,1236,130,190,{body:'#3a2a22',face:'#120e0c',on:'#ffd9a0',off:'rgba(255,217,160,.06)',glow:9});
    g.drawImage(ovC,1610,170,250,680,1610,170,250,680);drawRack(g);drawBench(g,t);
    const order=cooks.slice().sort((a,b)=>a.y-b.y);
    const atOven=c=>c.x<1650&&c.y<WORK_Y+30;           // only someone working at the oven mouth is behind its front; anyone walking past is in front of it
    for(const c of order)if(atOven(c))drawCook(g,c,t);
    drawOvenFront(g,t);
    for(const c of order)if(!atOven(c))drawCook(g,c,t);
    g.fillStyle='rgba(255,255,255,.9)';for(const q of sugar)g.fillRect(q.x,q.y,2,2.4);
    for(const p of steam){const k=p.life/p.max,r=p.r*(1+k*1.7);g.globalAlpha=p.a*Math.sin(Math.PI*k);g.drawImage(puffC,p.x-r,p.y-r,r*2,r*2);}
    g.globalAlpha=1;g.globalCompositeOperation='lighter';
    for(const m of motes){const near=clamp(1-Math.hypot(m.x-1560,m.y-620)/520,0,1);g.globalAlpha=(.1+.5*near)*(.6+.4*Math.sin(t*.9+m.ph));g.fillStyle=near>.3?'#ffd9a0':'#f4efe6';g.fillRect(m.x,m.y,2.2,2.2);}   // flour dust, catching the oven light
    const fl=1+.05*Math.sin(t*4.7)+.03*Math.sin(t*11.3);
    g.globalAlpha=.16*fl;g.drawImage(glowC,1620-520,640-520,1040,1040);g.globalAlpha=.16;g.drawImage(glowC,935-360,220-360,720,720);
    g.globalAlpha=1;g.globalCompositeOperation='source-over';
    WARM.air(g,t);g.drawImage(fgC,0,880,W,200,-30,880,W+60,200);drawStock(g);WARM.front(g,t);
    g.drawImage(vigC,-30,-20,W+60,H+40);
  }
  function startAudio(){
    const B=bedIn(1.3),wind=noiseLoop(B,[['bandpass',420,1.1],['lowpass',900,.5]],.25,A.white,.6,-.3),whis=noiseLoop(B,[['bandpass',1150,7]],.015,A.white,.9,-.4);
    const stops=[wind,whis,noiseLoop(B,[['lowpass',210,.6]],.3,A.white,.5,.35),noiseLoop(B,[['bandpass',600,.5]],.07,A.white,.7,.35),noiseLoop(B,[['lowpass',150,.7]],.15,A.white,.5,0)];   // wind, its whistle, oven (low and airy layers), hood
    const hum=ac.createGain();hum.connect(B);const os=[[50,.02],[100,.014],[150,.006]].map(([f,gn])=>{const o=ac.createOscillator();o.frequency.value=f;const v=ac.createGain();v.gain.value=gn;o.connect(v);v.connect(hum);o.start();return o;});
    stops.push({stop(){os.forEach(o=>{try{o.stop();}catch(e){}});hum.disconnect();}});
    const stopChat=startChatter({voices:4,level:.9,density:.4,call:[26,60],laugh:[70,170],whistle:[60,150]});     // a quiet, early kitchen
    aud={wind,whis,stop(){stops.forEach(s=>s.stop());stopChat();}};
  }
  function stopAudio(){if(aud){aud.stop();aud=null;}}
  /* ── music: ~72 BPM, warm chords with soft bell accents ── */
  const music={band:'bakery',bpm:72,swing:.24,bell:true,scale:[0,2,4,7,9],progs:[
    {root:'F4',ch:[{n:['A3','C4','E4','G4'],b:'F2'},{n:['F3','A3','C4','E4'],b:'D2'},{n:['A3','C4','D4','F4'],b:'Bb1'},{n:['Bb3','D4','F4','G4'],b:'C2'}]},
    {root:'C4',ch:[{n:['E3','G3','B3','D4'],b:'C2'},{n:['G3','B3','D4','E4'],b:'E2'},{n:['A3','C4','E4','G4'],b:'F2'},{n:['F3','A3','C4','D4'],b:'G1'}]},
    {root:'Ab3',ch:[{n:['C4','Eb4','G4','Bb4'],b:'Ab1'},{n:['Eb3','Ab3','C4','G4'],b:'F2'},{n:['C4','Eb4','F4','Ab4'],b:'Db2'},{n:['Db4','F4','Ab4','Bb4'],b:'Eb2'}]},
    {root:'D4',ch:[{n:['F#3','A3','C#4','E4'],b:'D2'},{n:['A3','C#4','D4','F#4'],b:'B1'},{n:['B3','D4','F#4','A4'],b:'G1'},{n:['G3','B3','D4','E4'],b:'A1'}]},
  ]};
  const otherSounds='Dough slapping on the bench, the bench scraper, the rolling pin, loaf scoring, the peel, the oven door, trays sliding onto the rack, the glaze brush, powdered sugar, and dish clatter from the back sink.';
  return{id:'bakery',otherSounds,update,draw,startAudio,stopAudio,music,_dbg:{WARM,YOU,cooks,TASKS,recent,DOUGH,T,PT,SHEET,OVEN,SHELF,RACK,F,BOWL,STOCK,DONE,FT,BD}};
};

/* ───────────────────────── 6. APP SHELL ───────────────────────── */
const cv=document.getElementById('cv'),g=cv.getContext('2d');
const $=id=>document.getElementById(id);
let T=0;
/* a kitchen is run ahead in silence for half a minute before it is shown, so everyone is already at work when the fade lifts */
function makeScene(id){const s=SCENES[id]();PRE=true;try{for(let i=0;i<1000;i++)s.update(1/30,T+i/30);}finally{PRE=false;}return s;}
let scene=makeScene('ramen'),sceneId='ramen',chosen='ramen',started=false,switching=false;
let last=performance.now(),fade=0,fadeT=0;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';}
addEventListener('resize',fit);fit();
function tickFrame(dt){
  T+=dt;scene.update(dt,T);
  fade+=clamp(fadeT-fade,-dt/2.4,dt/2.4);
  /* very slow camera drift: a few pixels over a minute */
  const cam={x:Math.sin(T*TAU/78)*5+Math.sin(T*TAU/29)*1.2,y:Math.cos(T*TAU/96)*3},z=1.014+Math.sin(T*TAU/120)*.003;
  g.setTransform(z,0,0,z,W/2*(1-z)+cam.x,H/2*(1-z)+cam.y);
  scene.draw(g,T,cam);
  g.setTransform(1,0,0,1,0,0);
  if(fade>.003){g.globalAlpha=fade;g.fillStyle='#000';g.fillRect(0,0,W,H);g.globalAlpha=1;}
}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;tickFrame(dt);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__kitchen={ff(sec,step=1/30){for(let t=0;t<sec;t+=step)tickFrame(step);},sim(sec,step=1/30){for(let t=0;t<sec;t+=step){T+=step;scene.update(step,T);}},load(id){scene=makeScene(id);sceneId=id;},Music,get scene(){return scene;}};

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.id);toast.id=setTimeout(()=>t.classList.remove('on'),2200);}
let level=0,muted=false;
const syncRadio=()=>{radioOn=!started||(!muted&&+$('masterVol').value>0&&+document.querySelector('[data-bus="music"]').value>0);};      // no notes drift out of the radio while the music is muted or turned right down
function ramp(v,sec){level=v;A.master.gain.cancelScheduledValues(ac.currentTime);A.master.gain.setTargetAtTime(muted?0:v,ac.currentTime,sec/3);}
function toggleMute(){if(!started)return;muted=!muted;ramp(level,.25);const b=$('muteBtn');b.textContent=muted?'Unmute (M)':'Mute (M)';b.setAttribute('aria-pressed',muted);syncRadio();}
function startSceneAudio(){
  scene.startAudio();
  try{Music.start(scene.music);}catch(e){console.warn('Music failed to start',e);toast('The music couldn’t start; kitchen sounds are still on.');}
}
async function begin(){
  if(started)return;
  const b=$('begin');b.disabled=true;
  if(!window.Tone){b.disabled=false;toast('Tone.js didn’t load, so there’s no sound. Check your connection and reload.');return;}
  try{
    if(!A.ready){await Tone.start();initAudio(Tone.getContext().rawContext);}
    clearTimeout(goHome.id);if(homeAudio){scene.stopAudio();Music.stop();homeAudio=false;}
    if(chosen!==sceneId||wasHome){scene=makeScene(chosen);sceneId=chosen;wasHome=false;}
    startSceneAudio();ramp(1,2.5);
    started=true;syncRadio();b.disabled=false;$('start').hidden=true;$('mixer').hidden=false;
  }catch(e){console.error(e);b.disabled=false;toast('Sound couldn’t start: '+e.message);}
}
/* slow crossfade of picture and sound */
function switchScene(id){
  if(!SCENES[id]){if(!document.body.classList.contains('clean'))toast('That kitchen isn’t on the menu yet.');return;}
  if(!started){chosen=id;return;}
  if(id===sceneId||switching)return;
  switching=true;fadeT=1;ramp(0,2.2);
  setTimeout(()=>{scene.stopAudio();Music.stop();scene=makeScene(id);sceneId=id;startSceneAudio();fadeT=0;ramp(1,2.5);switching=false;},2600);
}
/* back to the start screen to pick another kitchen */
let homeAudio=false,wasHome=false;
function goHome(){
  if(!started||switching)return;
  started=false;syncRadio();homeAudio=true;wasHome=true;ramp(0,.8);
  goHome.id=setTimeout(()=>{if(homeAudio){scene.stopAudio();Music.stop();homeAudio=false;}},1200);
  document.body.classList.remove('clean');$('mixer').hidden=true;$('start').hidden=false;chosen=sceneId;
  document.querySelectorAll('.ticket').forEach(o=>o.setAttribute('aria-pressed',o.dataset.scene===sceneId));
}
function toggleClean(){if(started)document.body.classList.toggle('clean');}
function fullscreen(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>toast('Fullscreen is blocked here. Use your browser’s own fullscreen (F11).'));}catch(e){toast('Fullscreen is blocked here. Use your browser’s own fullscreen (F11).');}}
$('begin').addEventListener('click',begin);
$('hideBtn').addEventListener('click',toggleClean);
$('muteBtn').addEventListener('click',toggleMute);
$('homeBtn').addEventListener('click',goHome);
$('fsBtn').addEventListener('click',fullscreen);
$('stage').addEventListener('dblclick',()=>document.body.classList.remove('clean'));
document.querySelectorAll('.ticket').forEach(b=>b.addEventListener('click',()=>{chosen=b.dataset.scene;if(!started&&SCENES[chosen]&&chosen!==sceneId){scene=makeScene(chosen);sceneId=chosen;}   // preview the chosen kitchen behind the start screen
  document.querySelectorAll('.ticket').forEach(o=>o.setAttribute('aria-pressed',o===b));}));
document.querySelectorAll('#mixer input[data-bus]').forEach(i=>i.addEventListener('input',()=>{if(A.ready)A.bus[i.dataset.bus].gain.setTargetAtTime(sliderGain(+i.value,i.dataset.bus),ac.currentTime,.05);if(Music.crackle)Music.crk.gain.setTargetAtTime(Music.crackleGain(),ac.currentTime,.05);syncRadio();}));
$('masterVol').addEventListener('input',e=>{if(A.ready)A.out.gain.setTargetAtTime(masterGain(+e.target.value),ac.currentTime,.05);syncRadio();});
$('bassEq').addEventListener('input',e=>{if(A.ready)A.bass.gain.setTargetAtTime((+e.target.value-50)*.3,ac.currentTime,.05);});
/* what "other kitchen sounds" means in this kitchen: hover, focus, or long-press */
{const lbl=$('otherLbl'),tip=$('tip');let hold;
  const show=()=>{tip.textContent=scene.otherSounds||'';tip.hidden=false;},hide=()=>{tip.hidden=true;clearTimeout(hold);};
  lbl.addEventListener('mouseenter',show);lbl.addEventListener('mouseleave',hide);lbl.addEventListener('focus',show);lbl.addEventListener('blur',hide);
  lbl.addEventListener('touchstart',()=>{hold=setTimeout(show,450);},{passive:true});
  for(const ev of['touchend','touchcancel'])lbl.addEventListener(ev,()=>{clearTimeout(hold);setTimeout(hide,3500);});}
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toLowerCase();
  if(k==='h')toggleClean();else if(k==='f')fullscreen();else if(k==='m')toggleMute();
  else if('1234'.includes(k)&&k)switchScene(['ramen','diner','bistro','bakery'][+k-1]);
});
})();
</script>
